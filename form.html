<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review | Itai Matope</title>
  <meta name="description" content="WDD 131 Week 05 product review form assignment by Itai Matope">
  <meta name="author" content="Itai Matope">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form method="get" action="review.html" class="review-form">
      <label for="product-name">Product Name</label>
      <select id="product-name" name="productName" required>
        <option value="" disabled selected>Select a Product ...</option>
      </select>

      <fieldset class="rating-group">
        <legend>Overall Rating</legend>
        <div class="rating-options">
          <div class="rating-choice">
            <label for="rating-1">&star;</label>
            <input type="radio" id="rating-1" name="rating" value="1" required>
          </div>
          <div class="rating-choice">
            <label for="rating-2">&star;&star;</label>
            <input type="radio" id="rating-2" name="rating" value="2" required>
          </div>
          <div class="rating-choice">
            <label for="rating-3">&star;&star;&star;</label>
            <input type="radio" id="rating-3" name="rating" value="3" required>
          </div>
          <div class="rating-choice">
            <label for="rating-4">&star;&star;&star;&star;</label>
            <input type="radio" id="rating-4" name="rating" value="4" required>
          </div>
          <div class="rating-choice">
            <label for="rating-5">&star;&star;&star;&star;&star;</label>
            <input type="radio" id="rating-5" name="rating" value="5" required>
          </div>
        </div>
      </fieldset>

      <label for="install-date">Date of Installation</label>
      <input type="date" id="install-date" name="installDate" required>

      <fieldset class="features-group">
        <legend>Which features did you find useful in the product?</legend>
        <p>(Check all that apply)</p>
        <div class="checkbox-choice">
          <input type="checkbox" id="durability" name="features" value="durability">
          <label for="durability">Durability</label>
        </div>
        <div class="checkbox-choice">
          <input type="checkbox" id="ease-of-use" name="features" value="ease-of-use">
          <label for="ease-of-use">Ease of Use</label>
        </div>
        <div class="checkbox-choice">
          <input type="checkbox" id="performance" name="features" value="performance">
          <label for="performance">Performance</label>
        </div>
        <div class="checkbox-choice">
          <input type="checkbox" id="design" name="features" value="design">
          <label for="design">Design</label>
        </div>
      </fieldset>

      <label for="written-review">Written Review <span>(Optional)</span></label>
      <textarea id="written-review" name="writtenReview"></textarea>

      <label for="user-name">Your Name <span>(Optional)</span></label>
      <input type="text" id="user-name" name="userName">

      <input type="submit" value="Post Review">
    </form>
  </main>

  <footer>
    <p>&copy;<span id="currentyear"></span> Itai Matope, Zimbabwe</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
