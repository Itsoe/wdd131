<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temple Album | Itai Matope</title>
  <meta name="description" content="A photo album of temples of The Church of Jesus Christ of Latter-day Saints by Itai Matope">
  <meta name="author" content="Itai Matope">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Roboto:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/temples.css">
  <link rel="stylesheet" href="styles/temples-large.css">
  <script src="temples.js" defer></script>
</head>
<body>
  <header>
    <div class="header-content">
      <h2 class="site-title">Temple Album</h2>
      <button id="hamburger" aria-label="Toggle navigation menu" aria-expanded="false">&#9776;</button>
      <nav id="main-nav" aria-label="Main navigation">
        <a href="#">Home</a>
        <a href="#">Old</a>
        <a href="#">New</a>
        <a href="#">Large</a>
        <a href="#">Small</a>
      </nav>
    </div>
  </header>

  <main>
    <h1>Temples of The Church of Jesus Christ of Latter-day Saints</h1>

    <section class="gallery">
      <figure>
        <img
          src="images/burley-idaho.jpg"
          alt="Burley Idaho Temple, a white modern temple with a single spire set against a blue sky"
          loading="lazy"
          width="400"
          height="300"
        >
        <figcaption>Burley Idaho Temple</figcaption>
      </figure>

      <figure>
        <img
          src="images/mesa-arizona.jpg"
          alt="Mesa Arizona Temple with classical white columns photographed at golden hour through olive trees"
          loading="lazy"
          width="400"
          height="300"
        >
        <figcaption>Mesa Arizona Temple</figcaption>
      </figure>

      <figure>
        <img
          src="images/natal-brazil.jpg"
          alt="Natal Brazil Temple, a white temple with tall ornate spire surrounded by tropical palm trees"
          loading="lazy"
          width="400"
          height="300"
        >
        <figcaption>Natal Brazil Temple</figcaption>
      </figure>

      <figure>
        <img
          src="images/orlando-florida.jpg"
          alt="Orlando Florida Temple at sunset viewed from above showing tall central spire, fountains, and palm trees"
          loading="lazy"
          width="400"
          height="300"
        >
        <figcaption>Orlando Florida Temple</figcaption>
      </figure>

      <figure>
        <img
          src="images/phoenix-arizona.jpg"
          alt="Phoenix Arizona Temple at sunset with illuminated reflecting pool leading to the ornate entrance"
          loading="lazy"
          width="400"
          height="300"
        >
        <figcaption>Phoenix Arizona Temple</figcaption>
      </figure>

      <figure>
        <img
          src="images/winter-quarters-nebraska.jpg"
          alt="Winter Quarters Nebraska Temple, a white stone temple with a single spire amid lush green grounds"
          loading="lazy"
          width="400"
          height="300"
        >
        <figcaption>Winter Quarters Nebraska Temple</figcaption>
      </figure>

      <figure>
        <img
          src="images/yigo-guam.jpg"
          alt="Yigo Guam Temple, a white temple with a central spire surrounded by tropical landscaping"
          loading="lazy"
          width="400"
          height="300"
        >
        <figcaption>Yigo Guam Temple</figcaption>
      </figure>

      <figure>
        <img
          src="images/yorba-linda-california.jpg"
          alt="Yorba Linda California Temple, a white modern temple with a tall spire and manicured gardens"
          loading="lazy"
          width="400"
          height="300"
        >
        <figcaption>Yorba Linda California Temple</figcaption>
      </figure>

      <figure>
        <img
          src="images/yuma-arizona.jpg"
          alt="Yuma Arizona Temple, a white desert temple with a single spire and desert landscaping"
          loading="lazy"
          width="400"
          height="300"
        >
        <figcaption>Yuma Arizona Temple</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>&copy;<span id="currentyear"></span> Itai Matope, Zimbabwe</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
